name: Transcribe YouTube Video

on:
  schedule:
    # Automatically run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'YouTube Video URL, Channel URL, or input file'
        required: true
        default: 'https://www.youtube.com/@BDDSwamiMedia'
      days:
        description: 'Number of days to look back for channel uploads'
        required: true
        default: '1'
      language:
        description: 'Target transcription language (english or hindi)'
        required: true
        default: 'english'
        type: choice
        options:
          - english
          - hindi
      commit_transcripts:
        description: 'Save transcripts to dedicated "transcripts" branch'
        required: true
        type: boolean
        default: true

jobs:
  transcribe:
    name: Transcribe Video & Extract Audio
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (ffmpeg & yt-dlp)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg python3-pip
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
          ffmpeg -version

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Setup YouTube Cookies from Secret (if present)
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > cookies.txt
            echo "✅ Loaded YouTube cookies from YTDLP_COOKIES GitHub secret."
          else
            echo "ℹ️ No YTDLP_COOKIES secret found, proceeding with player client strategy rotation."
          fi

      - name: Run Tests
        run: npm test

      - name: Run Transcription Script
        env:
          CI: true
        run: |
          TARGET_INPUT="${{ inputs.target || 'https://www.youtube.com/@BDDSwamiMedia' }}"
          DAYS_INPUT="${{ inputs.days || '1' }}"
          LANG_INPUT="${{ inputs.language || 'english' }}"

          node bin/yta-transcribe.mjs -l "$LANG_INPUT" -d "$DAYS_INPUT" "$TARGET_INPUT"

      - name: Save Transcripts to Dedicated 'transcripts' Branch
        if: ${{ inputs.commit_transcripts == true || github.event_name == 'schedule' }}
        run: |
          if [ -d "transcripts" ] && [ -n "$(ls -A transcripts/ 2>/dev/null)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # Save generated transcripts to mktemp directory
            TMP_DIR=$(mktemp -d)
            cp -r transcripts "$TMP_DIR/"

            # Switch to 'transcripts' branch (or create orphan branch if first run)
            if git checkout transcripts 2>/dev/null; then
              git pull origin transcripts --ff-only 2>/dev/null || true
            else
              git checkout --orphan transcripts
              git rm -rf . 2>/dev/null || true
            fi

            # Copy generated transcripts back into branch
            mkdir -p transcripts
            cp -r "$TMP_DIR"/transcripts/* transcripts/ 2>/dev/null || true

            git add transcripts/
            if git diff --staged --quiet; then
              echo "No new transcripts to commit to 'transcripts' branch."
            else
              git commit -m "chore: auto-save transcripts [skip ci]"
              git push origin transcripts
              echo "✅ Successfully saved transcripts to 'transcripts' branch!"
            fi

            # Return to main branch
            git checkout main
          else
            echo "No transcripts directory found to save."
          fi

      - name: Upload Generated Transcripts as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-and-audio
          path: transcripts/
          retention-days: 14
